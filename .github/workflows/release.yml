name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: cswave-windows
            path: release\*.zip
          - platform: macos
            os: macos-latest
            artifact: cswave-macos
            path: release/*
          - platform: linux
            os: ubuntu-latest
            artifact: cswave-linux
            path: release/*

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Qt runtime libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Build Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Build macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/build_macos.sh

      - name: Build Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify all release artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          windows=(release-artifacts/cswave-*-windows-x64.zip)
          macos=(release-artifacts/cswave-*-macos.zip release-artifacts/cswave-*-macos.tar.gz)
          linux=(release-artifacts/cswave-*-linux-x64.tar.gz)

          if [[ "${#windows[@]}" -ne 1 ]]; then
            echo "Expected one Windows artifact, found ${#windows[@]}" >&2
            exit 1
          fi
          if [[ "${#macos[@]}" -ne 1 ]]; then
            echo "Expected one macOS artifact, found ${#macos[@]}" >&2
            exit 1
          fi
          if [[ "${#linux[@]}" -ne 1 ]]; then
            echo "Expected one Linux artifact, found ${#linux[@]}" >&2
            exit 1
          fi

          mkdir -p release-upload
          cp "${windows[0]}" release-upload/
          cp "${macos[0]}" release-upload/
          cp "${linux[0]}" release-upload/
          printf '%s\n' "${windows[@]}" "${macos[@]}" "${linux[@]}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: CSV Waveform Viewer ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-upload/*
