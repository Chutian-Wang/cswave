name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: cswave-windows
            path: release\*.zip
          - platform: macos
            os: macos-latest
            artifact: cswave-macos
            path: release/*
          - platform: linux
            os: ubuntu-latest
            artifact: cswave-linux
            path: release/*

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Qt runtime libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Build Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Build macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/build_macos.sh

      - name: Build Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
